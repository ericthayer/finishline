name: Release

# Opens or updates a release PR from Conventional Commits on main. Merging that PR
# bumps package.json, writes CHANGELOG.md and tags vX.Y.Z with a GitHub Release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
